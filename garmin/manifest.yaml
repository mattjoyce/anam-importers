manifest_spec: ductile.plugin
manifest_version: 1
name: anam_garmin
version: 0.1.0
protocol: 2
entrypoint: run.py
concurrency_safe: true
description: "Shapes what a Garmin watch recorded into Anam envelopes and emits them as anam_garmin.batch events, at most 49 to a batch, for anam_submit to post. Seven types: health.heart-rate-alert (FIT event 66) and health.heart-rate.hour (a UTC hour, a slot a minute), decoded from the monitoring FIT files GarminDB downloads; activity.exercise-session.garmin, one per session in the activity FIT files it downloads; health.sleep-episode, health.heart-rate.day (one fact a day), activity.steps and activity.day.garmin, from GarminDB's garmin.db, each timed by the Garmin Connect JSON GarminDB keeps beside it (daily summaries under fit_dir, sleep under sleep_dir), with source_time saying how. Reads them all, garmin.db read-only; holds no token and writes nothing."
commands:
  - name: handle
    type: read
    description: "After a GarminDB sync: the alerts, heart rate hours and sessions in the FIT files modified in the last lookback_days (default 3), and garmin.db's days from then on. Idempotent in Anam: what is already held is a no-op."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_garmin.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: poll
    type: read
    description: "Every alert and every heart rate hour in every FIT file under fit_dir, every session under activities_dir and every day in garmin_db, in batches: the resend-everything mode, labelled one snapshot unless a FIT file would not decode. Its retired-types list, which names a type it no longer sends so the operator can retract the facts, is empty now."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_garmin.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: health
    type: read
    description: "fit_dir, activities_dir, sleep_dir and garmin_db are readable, every FIT file decodes, every day and night is timed by Garmin, and everything in them conforms to its Definition."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
config_keys:
  required: [fit_dir, activities_dir, sleep_dir, garmin_db, person_id]
  optional: [lookback_days, busy_timeout_ms]
