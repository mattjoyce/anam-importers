manifest_spec: ductile.plugin
manifest_version: 1
name: anam_garmin
version: 0.1.0
protocol: 2
entrypoint: run.py
concurrency_safe: true
description: "Shapes what a Garmin watch recorded into Anam envelopes and emits them as anam_garmin.batch events, at most 49 to a batch, for anam_submit to post. Today: health.heart-rate-alert, decoded from the monitoring FIT files GarminDB downloads (FIT event 66). Reads the files; holds no token and writes nothing."
commands:
  - name: handle
    type: read
    description: "After a GarminDB sync: the alerts in the FIT files modified in the last lookback_days (default 3). Idempotent in Anam: an alert already held is a no-op."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_garmin.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: poll
    type: read
    description: "Every alert in every FIT file under fit_dir, in batches: the resend-everything mode, labelled a snapshot unless a file would not decode."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_garmin.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: health
    type: read
    description: "fit_dir is readable, every FIT file decodes, and every alert conforms to the Definition."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
config_keys:
  required: [fit_dir, person_id]
  optional: [lookback_days]
