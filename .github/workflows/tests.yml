name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "jsonschema>=4.18" pyyaml
      # The tests against a real anam daemon skip without ANAM_BIN, and the
      # DreamStation ones without a card copy.
      - run: python -m unittest discover -s tests -t .
