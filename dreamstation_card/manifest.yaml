manifest_spec: ductile.plugin
manifest_version: 1
name: anam_dreamstation
version: 0.1.0
protocol: 2
entrypoint: run.py
concurrency_safe: true
description: "Shapes a Philips DreamStation SD card copy (P-SERIES) into Anam health.cpap-session.dreamstation envelopes, one per therapy session, and emits them as anam_dreamstation.batch events, at most 49 to a batch, for anam_submit to post. Every run sends the whole card. Reads the card; holds no token and writes nothing."
commands:
  - name: handle
    type: read
    description: "On a folder_watch event for the card copy: every session on the card. A newer copy holds every older session, so a resend is all no-op but the new ones."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_dreamstation.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: poll
    type: read
    description: "Every session on the card, in batches: the resend-everything mode."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
      events: array
    values:
      consume: []
      emit:
        - event: anam_dreamstation.batch
          values:
            - payload.envelopes
            - payload.definitions
            - payload.batch
  - name: health
    type: read
    description: "The card decodes and every session conforms to the Definition."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      status: string
config_keys:
  required: [card_path, person_id]
  optional: []
